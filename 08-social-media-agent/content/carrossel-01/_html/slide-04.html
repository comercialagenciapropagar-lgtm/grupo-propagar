<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 04</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700;1,900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Manrope:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --cream: #f5f1e8;
      --cream-deep: #ede7d8;
      --ink: #1a1a1a;
      --ink-soft: #3a3a3a;
      --gold: #b8945a;
      --gold-deep: #8b6f3d;
      --warm-gray: #7a7266;
      --line: rgba(139,111,61,0.25);
    }

    body {
      background: #0a0a0a;
      font-family: 'Inter', sans-serif;
      padding: 48px 24px 80px;
      min-height: 100vh;
    }

    header {
      max-width: 1280px;
      margin: 0 auto 56px;
      text-align: center;
      color: #fff;
    }
    header h1 {
      font-family: 'Fraunces', serif;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    header h1 em { color: var(--gold); font-style: italic; font-weight: 700; }
    header .meta {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      font-weight: 600;
    }

    .grid {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
    }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 820px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 540px) { .grid { grid-template-columns: 1fr; } }

    .wrap { text-align:center; }
    .label {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* SLIDE BASE */
    .slide {
      width: 100%;
      aspect-ratio: 1;
      background: var(--cream);
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    /* Tag dourada (pill) */
    .tag-pill {
      padding: 12px 26px;
      background: var(--gold-deep);
      color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      letter-spacing: 5px;
      font-weight: 700;
      display: inline-block;
    }

    /* Tag minimalista (linha + texto) */
    .tag-line {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 32px;
    }
    .tag-line .line { width: 50px; height: 2px; background: var(--gold); }
    .tag-line .txt {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      letter-spacing: 5px;
      color: var(--warm-gray);
      font-weight: 700;
      text-transform: uppercase;
    }

    .handle {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      letter-spacing: 4px;
      color: var(--warm-gray);
      font-weight: 700;
      opacity: 0.85;
    }

    .arrow-cue {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: var(--gold-deep);
      font-size: 22px;
      letter-spacing: 3px;
      font-weight: 700;
    }

    .s1 .photo .pill-top {
      position: absolute; top: 6%; left: 6%;
    }
    .s1 .photo .handle-top {
      position: absolute; top: 7%; right: 6%;
      color: #fff; opacity: 0.95;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .s1 .body {
      flex: 1;
      padding: 7% 8%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .s1 .body h2 {
      font-family: 'Fraunces', serif;
      font-size: 60px;
      color: var(--ink);
      line-height: 1.15;
      font-weight: 700;
    }
    .s1 .body em {
      color: var(--gold-deep);
      font-style: italic;
      font-weight: 700;
    }
    .s1 .arrow-cue {
      position: absolute;
      bottom: 7%; right: 7%;
    }

    /* ============ S2 — TEXTO PURO COM NÚMERO GIGANTE ============ */
    .s2 { padding: 9% 9%; display: flex; flex-direction: column; justify-content: center; }
    .s2 .num {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: var(--gold);
      font-size: 200px;
      line-height: 0.85;
      font-weight: 700;
      letter-spacing: -4px;
    }
    .s2 .num .unit {
      font-size: 88px;
      color: var(--gold-deep);
    }
    .s2 .accent { width: 80px; height: 3px; background: var(--gold-deep); margin: 28px 0 36px; }
    .s2 h2 {
      font-family: 'Fraunces', serif;
      font-size: 50px;
      color: var(--ink);
      line-height: 1.18;
      font-weight: 700;
    }
    .s2 .small {
      font-family: 'Manrope', sans-serif;
      font-size: 22px;
      color: var(--warm-gray);
      margin-top: 26px;
      line-height: 1.55;
    }
    .s2 .small strong { color: var(--gold-deep); font-weight: 700; }
    .s2 .handle-bot {
      position: absolute; bottom: 6%; right: 7%;
    }

    .s3 .photo .handle-bl {
      position: absolute; bottom: 6%; left: 8%;
      color: #fff; opacity: 0.95;
      font-size: 11px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .s3 .body {
      flex: 1;
      padding: 9% 7%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .s3 h2 {
      font-family: 'Fraunces', serif;
      font-size: 46px;
      color: var(--ink);
      line-height: 1.15;
      font-weight: 700;
    }
    .s3 .body p {
      font-family: 'Manrope', sans-serif;
      font-size: 22px;
      color: var(--warm-gray);
      line-height: 1.5;
      margin-top: 24px;
    }
    .s3 .quote {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: var(--gold-deep);
      font-size: 36px;
      margin-top: 28px;
      line-height: 1.25;
      border-left: 4px solid var(--gold);
      padding-left: 22px;
      font-weight: 700;
    }

    /* ============ S4 — SPLIT TEXTO ESQUERDA + FOTO DIREITA (invertido) ============ */
    .s4 { display: flex; }
    .s4 .body {
      flex: 1;
      padding: 9% 7%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .s4 h2 {
      font-family: 'Fraunces', serif;
      font-size: 56px;
      color: var(--ink);
      line-height: 1.1;
      font-weight: 700;
    }
    .s4 .stress {
      font-family: 'Manrope', sans-serif;
      font-size: 22px;
      color: var(--warm-gray);
      margin-top: 28px;
      line-height: 1.5;
    }
    .s4 .stress strong { color: var(--ink); font-weight: 700; }
    .s4 .vs-line {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: var(--gold-deep);
      font-size: 22px;
      margin: 18px 0 10px;
      letter-spacing: 2px;
    }
    .s4 h3 {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 56px;
      color: var(--gold-deep);
      font-weight: 700;
      line-height: 1.05;
    }

    /* ============ S5 — REGRA DO 7 (texto + diagrama) ============ */
    .s5 { padding: 9% 9%; display: flex; flex-direction: column; justify-content: center; }
    .s5 .num {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: var(--gold);
      font-size: 280px;
      line-height: 0.85;
      font-weight: 700;
      letter-spacing: -8px;
    }
    .s5 .accent { width: 80px; height: 3px; background: var(--gold-deep); margin: 24px 0 32px; }
    .s5 h2 {
      font-family: 'Fraunces', serif;
      font-size: 56px;
      color: var(--ink);
      line-height: 1.1;
      font-weight: 700;
    }
    .s5 .legend {
      font-family: 'Manrope', sans-serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: var(--warm-gray);
      text-transform: uppercase;
      font-weight: 700;
      margin: 32px 0 14px;
    }
    .s5 .dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .s5 .dot {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid var(--gold);
    }
    .s5 .dot.fill { background: var(--gold-deep); border-color: var(--gold-deep); }
    .s5 .dot.cart {
      width: 44px; height: 44px;
      border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }
    .s5 .arrow-line { flex: 1; height: 2px; background: var(--line); min-width: 8px; }
    .s5 .body { font-family: 'Manrope', sans-serif; font-size: 22px; color: var(--warm-gray); line-height: 1.55; margin-top: 32px; }
    .s5 .body em {
      font-family: 'Fraunces', serif;
      color: var(--gold-deep);
      font-style: italic;
      font-weight: 700;
      font-size: 32px;
      display: block;
      margin-top: 14px;
    }
    .s5 .handle-bot { position: absolute; bottom: 6%; right: 7%; }

    /* ============ S6 — REFRAME / COMPARAÇÃO ============ */
    .s6 { padding: 9% 9%; display: flex; flex-direction: column; justify-content: center; }
    .s6 h2 {
      font-family: 'Fraunces', serif;
      font-size: 110px;
      color: var(--ink);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -2px;
    }
    .s6 h2 em {
      font-style: italic;
      color: var(--gold-deep);
      font-size: 130px;
    }
    .s6 .compare {
      display: flex;
      gap: 8%;
      margin-top: 56px;
      padding-top: 36px;
      border-top: 2px solid var(--line);
    }
    .s6 .item { flex: 1; }
    .s6 .item-label {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--warm-gray);
      font-weight: 700;
      margin-bottom: 16px;
    }
    .s6 .item-val {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: var(--gold-deep);
      font-size: 48px;
      line-height: 1.15;
      font-weight: 700;
    }
    .s6 .small {
      font-family: 'Manrope', sans-serif;
      font-size: 20px;
      color: var(--warm-gray);
      margin-top: 40px;
      line-height: 1.5;
    }
    .s6 .handle-bot { position: absolute; bottom: 6%; right: 7%; }

    .s7 .photo .pill-top {
      position: absolute; top: 8%; left: 6%;
    }
    .s7 .photo .handle-top {
      position: absolute; top: 9%; right: 6%;
      color: #fff; opacity: 0.95;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .s7 .body {
      flex: 1;
      padding: 6% 7%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .s7 h2 {
      font-family: 'Fraunces', serif;
      font-size: 38px;
      color: var(--ink);
      line-height: 1.18;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .s7 h2 em { color: var(--gold-deep); font-style: italic; }
    .s7 .step {
      display: flex;
      align-items: flex-start;
      gap: 22px;
      margin-bottom: 20px;
    }
    .s7 .step-num {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: var(--gold);
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      flex-shrink: 0;
      width: 44px;
    }
    .s7 .step-txt {
      font-family: 'Manrope', sans-serif;
      color: var(--ink-soft);
      font-size: 22px;
      line-height: 1.4;
    }
    .s7 .step-txt strong { color: var(--gold-deep); font-weight: 700; }

    /* ============ S8 — CTA ============ */
    .s8 {
      background: linear-gradient(135deg, #f5f1e8 0%, #ede7d8 100%);
      padding: 9% 9%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .s8 .top { display: flex; flex-direction: column; margin-bottom: 56px; }
    .s8 .num-big {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: var(--gold-deep);
      font-size: 220px;
      line-height: 0.9;
      font-weight: 700;
      letter-spacing: -6px;
    }
    .s8 .num-big .total {
      color: var(--warm-gray);
      font-size: 88px;
      opacity: 0.55;
    }
    .s8 .next-label {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      letter-spacing: 5px;
      color: var(--warm-gray);
      text-transform: uppercase;
      font-weight: 700;
      margin: 40px 0 18px;
    }
    .s8 .next-title {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 42px;
      color: var(--ink);
      line-height: 1.2;
      font-weight: 700;
    }
    .s8 .cta {
      padding-top: 36px;
      border-top: 2px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .s8 .cta-line {
      font-family: 'Manrope', sans-serif;
      font-size: 22px;
      color: var(--ink-soft);
    }
    .s8 .cta-line strong { color: var(--gold-deep); font-weight: 700; }
    .s8 .handle-final {
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      letter-spacing: 6px;
      color: var(--gold-deep);
      font-weight: 700;
      text-align: center;
      margin-top: 36px;
    }

    /* PS monogram (canto inferior direito em slides com foto) */
    .ps-mono {
      position: absolute;
      bottom: 5%; right: 5%;
      width: 32px; height: 32px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      color: var(--gold-deep);
      font-weight: 700;
      letter-spacing: 1px;
    }
    .ps-mono.on-photo { color: #fff; border-color: rgba(255,255,255,0.6); }

    .footer {
      max-width: 1280px;
      margin: 64px auto 0;
      padding: 32px;
      background: rgba(184,148,90,0.08);
      border: 1px solid rgba(184,148,90,0.25);
      border-radius: 12px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      line-height: 1.7;
    }
    .footer h2 {
      font-family: 'Fraunces', serif;
      color: var(--gold);
      font-size: 18px;
      margin-bottom: 12px;
    }
    .footer code {
      background: rgba(184,148,90,0.12);
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--gold);
      font-size: 12px;
    }

  aspect-ratio: unset !important;

  margin: 0 !important;
  position: relative !important;
}
